spring:
    file-storage:
        concat-date: true
        storage-type: 'minio'
        local:
            entry-path: '/Volumes/Workspace/storage'
            domain: 'http://localhost:8090'
        minio:
            endpoint: 'localhost'
            access-key: 'minioadmin'
            secret-key: 'minioadmin'
            bucket-name: 'demo-bucket'
            bucket-public: true
